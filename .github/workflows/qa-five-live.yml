name: Read-only five Amazon Cloudflare live QA
on:
  push:
    paths:
      - '.github/workflows/qa-five-live.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cloudflare-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Worker health and five known Mongo ASINs without secrets
        shell: bash
        run: |
          set -u
          base="https://trustfolio-live-price-worker.jayantjoshi-joshi.workers.dev"
          echo '=== WORKER HEALTH ==='
          health=$(curl -fsS --max-time 15 "$base/health") || { echo 'DEPLOY_VERIFY_FAILED:health_unavailable'; exit 1; }
          echo "$health"
          if ! echo "$health" | grep -q '"amazonBrowserQALock":"per-asin-v2"'; then
            echo 'DEPLOY_VERIFY_FAILED:per_asin_fix_not_live'
            exit 1
          fi
          echo 'DEPLOY_VERIFY_PASS:per_asin_fix_live'
          echo '=== AMAZON PRICE FORMAT DIAGNOSTIC ==='
          curl -sS -L --max-time 15 -w '\nHTTP_STATUS:%{http_code} TOTAL_SEC:%{time_total}\n' "$base/qa/amazon-format?sku=B0H75M7JKH" || true
          # Workers Free Browser Run Quick Actions: <= 1 request per 10 seconds.
          # A 12s gap protects against timing jitter. Do not auto-retry 429.
          for asin in B0DVH1HDVQ B074J9SPYX B08RC27RJM B0F24RTBDQ; do
            echo "=== AMAZON BROWSER ASIN:$asin ==="
            sleep 12
            curl -sS -L --max-time 45 -w '\nHTTP_STATUS:%{http_code} TOTAL_SEC:%{time_total}\n' "$base/qa/amazon-browser-one?sku=$asin" || true
          done
          ids=(B0H75M7JKH B0DVH1HDVQ B074J9SPYX B08RC27RJM B0F24RTBDQ)
          for i in 0 1 2 3 4; do
            echo "=== AMAZON_INDEX:$i ASIN:${ids[$i]} ==="
            curl -sS -L --max-time 20 -w '\nHTTP_STATUS:%{http_code} TOTAL_SEC:%{time_total}\n' "$base/qa/check-100?platform=amazon&index=$i&rev=v3" || true
            echo
          done
