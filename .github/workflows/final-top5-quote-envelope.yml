      - name: Independent fresh Lenovo primary Offer because new quote changed
        run: |
          python3 - <<'PY'
          import json,time,re,hashlib,datetime
          from urllib.request import Request,urlopen
          from pathlib import Path
          url='https://www.flipkart.com/lenovo-chromebook-11ijl9-intel-celeron-dual-core-n4500-4-gb-64-gb-emmc-storage-chrome-os/p/itmd2a376187074e?pid=COMHCYMG83BGNQHH'
          e={'status':'UNVERIFIED','url':url,'atUTC':datetime.datetime.now(datetime.timezone.utc).isoformat(),'kind':'independent retailer HTML; not a Worker request'}
          t=time.monotonic()
          try:
           with urlopen(Request(url,headers={'User-Agent':'TrustFolio-Independent-Price/1.0'}),timeout=8) as r:
            raw=r.read(2500001);e['httpStatus']=r.status;e['finalUrl']=r.url
           e['bytes']=len(raw);e['sha256']=hashlib.sha256(raw).hexdigest()
           assert len(raw)<=2500000,'bounded body limit'
           products=[]
           def walk(x):
            if isinstance(x,list):
             for y in x:walk(y)
            elif isinstance(x,dict):
             if x.get('@type')=='Product':products.append(x)
             if '@graph' in x:walk(x['@graph'])
           for s in re.findall(r'<script\b[^>]*type=["\']application/ld\+json["\'][^>]*>([\s\S]*?)</script>',raw.decode(errors='replace'),re.I):
            try:walk(json.loads(s))
            except:pass
           e['productCount']=len(products)
           e['products']=[{k:p.get(k) for k in ['name','sku','productID','offers']} for p in products]
           if len(products)==1 and products[0].get('sku')=='COMHCYMG83BGNQHH':
            offers=products[0].get('offers');offers=offers if isinstance(offers,list) else [offers]
            if len(offers)==1 and offers[0].get('priceCurrency')=='INR':
             e['primaryPrice']=float(offers[0]['price']);e['matchesCurrentCanary22911']=e['primaryPrice']==22911
             e['status']='PASS' if e['matchesCurrentCanary22911'] else 'UNVERIFIED'
          except Exception as err:e['error']=type(err).__name__+': '+str(err)
          e['latencyMs']=round((time.monotonic()-t)*1000)
          Path('lenovo-fresh-independent.json').write_text(json.dumps(e))
          print('LENOVO_FRESH_INDEPENDENT='+json.dumps(e))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: lenovo-fresh-independent
          path: lenovo-fresh-independent.json
          retention-days: 30
