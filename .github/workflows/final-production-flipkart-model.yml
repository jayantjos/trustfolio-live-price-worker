name: Only missing Flipkart model metadata evidence
on:
  push:
    branches: [production-readiness-final-20261103]
    paths: ['.github/workflows/final-production-flipkart-model.yml']
permissions:
  contents: read
jobs:
  model:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Exact primary owner model metadata only no repeated Worker price checks
        run: |
          cat > accuracy-cases.json <<'JSON'
          [{"id":"WMNHBK4HNYBSDJ9U","url":"https://www.flipkart.com/godrej-9-kg-ai-tech-fully-automatic-front-load-washing-machine-in-built-heater-white-grey/p/itm85c805abf4849?pid=WMNHBK4HNYBSDJ9U","platform":"flipkart","brand":"Godrej","catalogTitle":"Godrej 9 kg with AI Tech Fully Automatic Front Load Washing Machine with In-built Heater White, Grey","capacity":"9 kg","catalogMongoId":"69f419329a622ea2d7ccb736"},{"id":"B0D41L64NR","url":"https://www.amazon.in/dp/B0D41L64NR","platform":"amazon","brand":"Bosch","catalogTitle":"Bosch 9 kg 5 Star Front Load Fully-Automatic Washing Machine, AI ActiveWater, 14 Wash Programs, Removes 99.9% Germs with Steam, No Tangle or Wrinkle, SoftCare Paddle,Zero Vibration, White, WGA14200IN","capacity":"9 kg","catalogMongoId":"6a080110fe6fd8dc386bbee3"},{"id":"WMNHHUCY5FWTHBAN","url":"https://www.flipkart.com/haier-8-kg-ai-smart-wash-ai-dbt-puristeam-525mm-super-drum-fully-automatic-front-load-washing-machine-in-built-heater-black/p/itm5b001b74dc1cc?pid=WMNHHUCY5FWTHBAN","platform":"flipkart","brand":"Haier","catalogTitle":"Haier 8 kg AI Smart Wash (AI-DBT) , PuriSteam , 525mm Super Drum Fully Automatic Front Load Washing Ma","capacity":"8 kg","catalogMongoId":"6a2c08a19665e4a0b177b34b"},{"id":"WMNG4WGVXYSRYHJZ","url":"https://www.flipkart.com/motorola-7-kg-5-star-rating-garment-sterilization-fully-automatic-front-load-washing-machine-in-built-heater-white/p/itm1ad6a5136676c?pid=WMNG4WGVXYSRYHJZ","platform":"flipkart","brand":"Motorola","catalogTitle":"Motorola 7 Kg 5 Star Rating Garment Sterilization Fully Automatic Front Load Washing Machine In Built Heater White","capacity":"7 kg","catalogMongoId":"6a1013380f397d1e1344dd59"},{"id":"B0GX9P1BWT","url":"https://www.amazon.in/dp/B0GX9P1BWT","platform":"amazon","brand":"Samsung","catalogTitle":"Samsung 7 kg, 5 Star, Hygiene Steam, Quick Wash, Digital Inverter Motor, Fully-Automatic Front Load Washing Machine (WW70FG4S02AXTL, Inox)","capacity":"7 kg","catalogMongoId":"6a1011ac0f397d1e1344d8d1"}]
          JSON
          cat > model.py <<'PY'
          import json,re,time,hashlib,datetime,concurrent.futures
          from pathlib import Path
          from urllib.request import Request,urlopen
          def work(c):
           e={'id':c['id'],'url':c['url'],'atUTC':datetime.datetime.now(datetime.timezone.utc).isoformat(),'status':'UNVERIFIED','purpose':'missing model metadata only; no Worker or price retest'}
           try:
            with urlopen(Request(c['url'],headers={'User-Agent':'TrustFolio-Independent-Primary-Verification/1.0'}),timeout=8) as r:raw=r.read(2500001);e['http']=r.status;e['finalUrl']=r.url
            assert len(raw)<=2500000;e['sha256']=hashlib.sha256(raw).hexdigest();s=raw.decode(errors='replace');trees=[]
            for script in re.findall(r'<script\b[^>]*>([\s\S]*?)</script>',s,re.I):
             t=script.strip()
             try:trees.append(json.loads(t));continue
             except:pass
             m=re.search(r'(?:window\.)?__(?:INITIAL_STATE|NEXT_DATA|PRELOADED_STATE)__\s*=\s*',t)
             if m:
              try:trees.append(json.JSONDecoder().raw_decode(t[m.end():])[0])
              except:pass
            owners=[];seen=set()
            def exact(x):
             if not isinstance(x,dict):return False
             vals=[x.get(k) for k in ['productId','productID','pid','sku','id']]
             meta=x.get('productMeta');vals+=([meta.get('productId')] if isinstance(meta,dict) else [])
             return any(v==c['id'] for v in vals)
            def find(x,path='root',depth=0):
             if depth>60:return
             if isinstance(x,dict):
              if exact(x):owners.append((path,x))
              for k,v in x.items():
               if isinstance(v,(dict,list)):find(v,path+'.'+k,depth+1)
             elif isinstance(x,list):
              for i,v in enumerate(x):find(v,path+f'[{i}]',depth+1)
            for t in trees:find(t)
            fields=[]
            def fieldsWalk(x,path,depth=0):
             if depth>40:return
             if isinstance(x,dict):
              other=[x.get(k) for k in ['productId','productID','pid','sku'] if isinstance(x.get(k),str)]
              if other and c['id'] not in other:return
              for k,v in x.items():
               if re.fullmatch(r'model(?:\s*(?:name|number|no))?',str(k),re.I) and v:fields.append({'path':path+'.'+k,'value':v})
              label=x.get('key') or x.get('name') or x.get('label')
              if isinstance(label,str) and re.fullmatch(r'model(?:\s*(?:name|number|no))?',label,re.I):fields.append({'path':path,'label':label,'value':x.get('value') or x.get('values')})
              for k,v in x.items():
               if isinstance(v,(dict,list)):fieldsWalk(v,path+'.'+k,depth+1)
             elif isinstance(x,list):
              for i,v in enumerate(x):fieldsWalk(v,path+f'[{i}]',depth+1)
            for p,o in owners:fieldsWalk(o,p)
            e['jsonTrees']=len(trees);e['exactOwnerCount']=len(owners);e['modelFields']=fields[:20]
            e['status']='PASS' if any(x.get('value') for x in fields) else 'UNVERIFIED'
           except Exception as err:e['error']=type(err).__name__+': '+str(err)
           return e
          cases=[c for c in json.loads(Path('accuracy-cases.json').read_text()) if c['platform']=='flipkart']
          with concurrent.futures.ThreadPoolExecutor(max_workers=2) as ex:results=list(ex.map(work,cases))
          r={'results':results,'productionWrites':0};Path('flipkart-model-results.json').write_text(json.dumps(r,indent=2));print('FLIPKART_MODEL_RESULTS='+json.dumps(r))
          
          PY
          python3 model.py
      - uses: actions/upload-artifact@v4
        with:
          name: flipkart-missing-model-evidence
          path: flipkart-model-results.json
          retention-days: 30
