name: Read-only 1042 account evidence for saved Ray IDs
on:
  push:
    branches: [investigate-1042-account-20261102]
    paths: ['.github/workflows/investigate-1042-account.yml']
permissions:
  contents: read
jobs:
  account-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Read metadata and query only saved historical Rays
        env:
          CF_READ_CREDENTIAL: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import os,json,datetime
          from urllib.request import Request,urlopen
          from urllib.error import HTTPError
          from pathlib import Path
          account='354ff26b7db5ae21ded578fbae86c15f'
          token=os.environ.get('CF_READ_CREDENTIAL','')
          assert token, 'Configured Cloudflare credential unavailable'
          base='https://api.cloudflare.com/client/v4'
          rows=[]
          def call(label,path,payload=None,project=None):
              req=Request(base+path,headers={'Authorization':'Bearer '+token,'Content-Type':'application/json'},data=None if payload is None else json.dumps(payload).encode(),method='GET' if payload is None else 'POST')
              try:
                  with urlopen(req,timeout=25) as r:status=r.status;body=json.load(r)
              except HTTPError as e:
                  status=e.code
                  try:body=json.loads(e.read())
                  except Exception:body={'error':'non-JSON HTTP error'}
              except Exception as e:status=None;body={'errorType':type(e).__name__}
              if status==200 and project:body=project(body)
              row={'label':label,'path':path,'httpStatus':status,'response':body}
              rows.append(row)
              return row
          def telemetry(body):
              result=body.get('result') or {}
              events=result.get('events') or {}
              safe=[]
              for e in events.get('events',[]):
                  meta=e.get('$metadata',{})
                  safe.append({'timestamp':e.get('timestamp'),'dataset':e.get('dataset'),'metadata':{k:v for k,v in meta.items() if k in ['id','rayId','service','origin','trigger','requestId','statusCode','error','region','url','type']},'workers':{k:v for k,v in (e.get('$workers') or {}).items() if k in ['scriptName','outcome','eventType','scriptVersion']}})
              return {'success':body.get('success'),'result':{'run':{k:v for k,v in (result.get('run') or {}).items() if k in ['id','status','dry']},'statistics':result.get('statistics'),'events':{'count':events.get('count'),'events':safe}}}
          
          d=json.loads(Path('qa/final-staging-acceptance/cloudflare-1042-diagnostics.json').read_text())
          rays=[];scripts=[]
          for exp in d['experiments']:
              exp=exp.get('result',exp);scripts.append(exp['stagingName'])
              for row in exp['responses']:
                  for k,v in row['headers'].items():
                      if k.lower()=='cf-ray':rays.extend([v,v.split('-')[0]])
          timeframe={'from':int(datetime.datetime(2026,11,2,16,27,tzinfo=datetime.timezone.utc).timestamp()*1000),'to':int(datetime.datetime(2026,11,2,16,33,tzinfo=datetime.timezone.utc).timestamp()*1000)}
          discovered=[]
          def key_projection(body):
              result=body.get('result',[])
              if isinstance(result,dict):result=result.get('keys',[])
              discovered.extend([x['key'] for x in result if isinstance(x,dict) and isinstance(x.get('key'),str)])
              return {'success':body.get('success'),'keyCount':len(discovered),'relevantKeys':[k for k in discovered if any(t in k.lower() for t in ['ray','service','scriptname','security','action'])]}
          call('discover_historical_telemetry_field_names',f'/accounts/{account}/workers/observability/telemetry/keys',{'timeframe':timeframe},key_projection)
          raykeys=[k for k in discovered if 'ray' in k.lower()][:4]
          if raykeys:
              payload={'queryId':'trustfolio-1042-discovered-ray-fields','dry':True,'timeframe':timeframe,'view':'events','limit':80,'parameters':{'filterCombination':'or','filters':[{'key':k,'operation':'in','type':'string','value':','.join(rays)} for k in raykeys]}}
              call('correlate_saved_rays_on_discovered_fields',f'/accounts/{account}/workers/observability/telemetry/query',payload,telemetry)
          service=next((k for k in ['$metadata.service','$workers.scriptName'] if k in discovered),None)
          if service:
              for label,values,limit in [('historical_staging_invocation_lookup',scripts,10),('historical_production_invocation_positive_control',['trustfolio-live-price-worker'],3)]:
                  payload={'queryId':'trustfolio-1042-'+label,'dry':True,'timeframe':timeframe,'view':'events','limit':limit,'parameters':{'filters':[{'key':service,'operation':'in','type':'string','value':','.join(values)}]}}
                  call(label,f'/accounts/{account}/workers/observability/telemetry/query',payload,telemetry)
          report={'status':'UNVERIFIED','purpose':'historical schema discovery and saved-Ray correlation only; no Worker requests or mutations','sourceCommit':os.environ['GITHUB_SHA'],'observedAtUTC':datetime.datetime.now(datetime.timezone.utc).isoformat(),'rows':rows}
          safe=json.dumps(report,ensure_ascii=False).replace(token,'[REDACTED]')
          Path('cloudflare-1042-account-evidence.json').write_text(safe)
          print('ACCOUNT_1042_EVIDENCE='+safe)
          
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloudflare-1042-account-evidence
          path: cloudflare-1042-account-evidence.json
          retention-days: 30
