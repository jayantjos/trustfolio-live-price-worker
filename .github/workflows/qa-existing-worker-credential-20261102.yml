name: Read-only external Worker credential canary
on:
  push:
    paths: ['.github/workflows/qa-existing-worker-credential-20261102.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  auth:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      TF_KEY: ${{ secrets.TF_PRICE_WORKER_KEY }}
      PRICE_KEY: ${{ secrets.PRICE_WORKER_KEY }}
    steps:
      - name: Check existing credential without products or configuration changes
        run: |
          python3 - <<'PY'
          import json,os,subprocess
          keys={v for v in [os.getenv('TF_KEY',''),os.getenv('PRICE_KEY','')] if v}
          report={'mongo_writes':0,'configuration_changes':0,'product_fetches':0,'existing_unique_key_count':len(keys),'attempted':False}
          if len(keys)==1:
              p=subprocess.run(['curl','-sS','--max-time','20','-w','\\n%{http_code}','-H','content-type: application/json','-H','x-api-key: '+next(iter(keys)),'--data','{"items":[],"useCache":false,"browserProbe":false}','https://trustfolio-live-price-worker.jayantjoshi-joshi.workers.dev/api/check'],capture_output=True,text=True,timeout=25)
              try:
                  raw,status=p.stdout.rsplit('\\n',1);body=json.loads(raw);report.update(attempted=True,http_status=int(status),authenticated=int(status)==200,error=body.get('error'))
              except:report.update(attempted=True,error='transport_or_non_json')
          else:report['blocker']='Existing matching backend/Worker credential unavailable or ambiguous in connected repository; no secret rotation attempted.'
          open('external-auth-canary.json','w').write(json.dumps(report,indent=2));print('EXTERNAL_AUTH='+json.dumps(report,separators=(',',':')))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: external-auth-readonly
          path: external-auth-canary.json
