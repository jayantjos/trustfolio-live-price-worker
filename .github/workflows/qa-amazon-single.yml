name: One-by-one Amazon Browser QA
on:
  push:
    paths:
      - '.github/workflows/qa-amazon-single.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  one-product:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Single ASIN browser check, no retries
        shell: bash
        run: |
          set -euo pipefail
          base="https://trustfolio-live-price-worker.jayantjoshi-joshi.workers.dev"
          health=$(curl -fsS --max-time 15 "$base/health")
          echo "$health"
          echo "$health" | grep -q '"amazonBrowserQALock":"per-asin-v2"'
          # Allow the existing per-ASIN cooldown to expire; one browser request only.
          sleep 330
          # Single Crompton fan diagnostic.
          for asin in B074J9SPYX; do
            echo "=== SINGLE_ASIN:$asin ==="
            curl -fsS --max-time 45 "$base/qa/amazon-browser-one?sku=$asin"
            echo
            sleep 12
          done
