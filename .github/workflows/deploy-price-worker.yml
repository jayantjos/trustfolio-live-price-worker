name: Deploy TrustFolio price Worker
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/deploy-price-worker.yml'
permissions:
  contents: read
concurrency:
  group: trustfolio-production-price-worker-deployment
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: 354ff26b7db5ae21ded578fbae86c15f
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm Cloudflare credential exists (without printing it)
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo 'DEPLOY_BLOCKED: CLOUDFLARE_API_TOKEN repository secret not configured'
            exit 1
          fi
      - name: Run parser and integration regression tests including named finish, DDR RAM, explicit watts and connectivity
        run: node --experimental-loader ./test/cloudflare-node-loader.mjs --test test/targeted-state.test.js test/croma-search.test.js test/backend-legacy-compatibility.test.js test/amazon-browser.test.js test/amazon-canonical.test.js test/amazon-strict-price-v12.test.js test/scrapedo-safe-price-parity.test.js test/audit-error-boundary.test.js test/fixed-flipkart-audit.test.js test/primary-product-identity.test.js test/amazon-catalog-audit.test.js test/catalog-identity.test.js
      - name: Deploy existing Wrangler Worker config
        run: npx --yes wrangler@4.155.0 deploy
      - name: Confirm primary-section extraction is live
        run: |
          for attempt in $(seq 1 10); do
            curl -fsS --max-time 15 https://trustfolio-live-price-worker.jayantjoshi-joshi.workers.dev/health > /tmp/tf-worker-health.json
            if python3 -c 'import json; d=json.load(open("/tmp/tf-worker-health.json")); assert d.get("priceVerificationContract")=="seven-states-v1" and d.get("amazonPrimaryScope")=="balanced-elements-v1" and d.get("flipkartFspIdentity")=="json-owner-v1"'; then break; fi
            if [ "$attempt" = 10 ]; then cat /tmp/tf-worker-health.json; exit 1; fi
            sleep 3
          done
          cat /tmp/tf-worker-health.json
          echo 'DEPLOY_VERIFY_PASS'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: worker-health-resume-20261102
          path: /tmp/tf-worker-health.json
      - name: Targeted unresolved examples only; no Browser Run or retries
        run: |
          python3 - <<'PYLIVE'
          import json
          from urllib.request import Request,urlopen
          from urllib.error import HTTPError
          rows=[]
          for sequence in [1,155,199,212,220,234,239,267]:
              req=Request('https://trustfolio-live-price-worker.jayantjoshi-joshi.workers.dev/qa/audit-300?sequence='+str(sequence),headers={'User-Agent':'TrustFolio-Targeted-QA/1.0','Accept':'application/json'})
              try:
                  with urlopen(req,timeout=40) as r:payload=json.load(r);status=r.status
              except HTTPError as e:status=e.code;payload={'errorBody':e.read().decode()[:300]}
              except Exception as e:status=None;payload={'errorType':type(e).__name__}
              rows.append({'sequence':sequence,'httpStatus':status,'response':payload})
          open('targeted-live-results.json','w').write(json.dumps(rows,indent=2))
          print('TARGETED_LIVE='+json.dumps(rows,separators=(',',':')))
          PYLIVE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pending-worker-targeted-live-results
          path: targeted-live-results.json
