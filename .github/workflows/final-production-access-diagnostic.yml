      - name: One bounded non-retailer health and authentication diagnostic
        env:
          TF_KEY: ${{ secrets.TF_PRICE_WORKER_KEY }}
        run: |
          python3 - <<'PY'
          import os,json,time,datetime,uuid
          from urllib.request import Request,urlopen
          from urllib.error import HTTPError
          from pathlib import Path
          key=os.environ['TF_KEY'];base='https://trustfolio-live-price-worker.jayantjoshi-joshi.workers.dev'
          out=[]
          for name,credential in [('health',None),('missing',None),('wrong','trustfolio-controlled-invalid-key'),('valid',key)]:
           headers={'User-Agent':'TrustFolio-Final-Access-Diagnostic/1.0','Content-Type':'application/json','x-request-id':str(uuid.uuid4())}
           if credential:headers['x-api-key']=credential
           body=None if name=='health' else json.dumps({'items':['https://example.com/not-a-product'],'useCache':False,'browserProbe':False}).encode()
           req=Request(base+('/health' if name=='health' else '/api/check'),headers=headers,data=body);t=time.monotonic()
           e={'case':name,'atUTC':datetime.datetime.now(datetime.timezone.utc).isoformat()}
           try:
            with urlopen(req,timeout=8) as r:e['http']=r.status;e['headers']={k:r.headers.get(k) for k in ['cf-ray','server','content-type','retry-after']};e['body']=r.read(600).decode(errors='replace')
           except HTTPError as r:e['http']=r.code;e['headers']={k:r.headers.get(k) for k in ['cf-ray','server','content-type','retry-after']};e['body']=r.read(600).decode(errors='replace')
           except Exception as err:e['error']=type(err).__name__
           e['latencyMs']=round((time.monotonic()-t)*1000);out.append(e)
          safe=json.dumps({'results':out,'kind':'non-retailer auth-only diagnostic'}).replace(key,'[REDACTED]')
          Path('access-diagnostic.json').write_text(safe);print('ACCESS_DIAGNOSTIC='+safe)
          PY
      - name: Independent retailer reads only, no repeat Worker product calls
        env:
          TF_KEY: ${{ secrets.TF_PRICE_WORKER_KEY }}
        run: |
          cat > accuracy-cases.json <<'JSON'
          [{"id":"WMNHBK4HNYBSDJ9U","url":"https://www.flipkart.com/godrej-9-kg-ai-tech-fully-automatic-front-load-washing-machine-in-built-heater-white-grey/p/itm85c805abf4849?pid=WMNHBK4HNYBSDJ9U","platform":"flipkart","brand":"Godrej","catalogTitle":"Godrej 9 kg with AI Tech Fully Automatic Front Load Washing Machine with In-built Heater White, Grey","capacity":"9 kg","catalogMongoId":"69f419329a622ea2d7ccb736"},{"id":"B0D41L64NR","url":"https://www.amazon.in/dp/B0D41L64NR","platform":"amazon","brand":"Bosch","catalogTitle":"Bosch 9 kg 5 Star Front Load Fully-Automatic Washing Machine, AI ActiveWater, 14 Wash Programs, Removes 99.9% Germs with Steam, No Tangle or Wrinkle, SoftCare Paddle,Zero Vibration, White, WGA14200IN","capacity":"9 kg","catalogMongoId":"6a080110fe6fd8dc386bbee3"},{"id":"WMNHHUCY5FWTHBAN","url":"https://www.flipkart.com/haier-8-kg-ai-smart-wash-ai-dbt-puristeam-525mm-super-drum-fully-automatic-front-load-washing-machine-in-built-heater-black/p/itm5b001b74dc1cc?pid=WMNHHUCY5FWTHBAN","platform":"flipkart","brand":"Haier","catalogTitle":"Haier 8 kg AI Smart Wash (AI-DBT) , PuriSteam , 525mm Super Drum Fully Automatic Front Load Washing Ma","capacity":"8 kg","catalogMongoId":"6a2c08a19665e4a0b177b34b"},{"id":"WMNG4WGVXYSRYHJZ","url":"https://www.flipkart.com/motorola-7-kg-5-star-rating-garment-sterilization-fully-automatic-front-load-washing-machine-in-built-heater-white/p/itm1ad6a5136676c?pid=WMNG4WGVXYSRYHJZ","platform":"flipkart","brand":"Motorola","catalogTitle":"Motorola 7 Kg 5 Star Rating Garment Sterilization Fully Automatic Front Load Washing Machine In Built Heater White","capacity":"7 kg","catalogMongoId":"6a1013380f397d1e1344dd59"},{"id":"B0GX9P1BWT","url":"https://www.amazon.in/dp/B0GX9P1BWT","platform":"amazon","brand":"Samsung","catalogTitle":"Samsung 7 kg, 5 Star, Hygiene Steam, Quick Wash, Digital Inverter Motor, Fully-Automatic Front Load Washing Machine (WW70FG4S02AXTL, Inox)","capacity":"7 kg","catalogMongoId":"6a1011ac0f397d1e1344d8d1"}]
          JSON
          cat > independent-only.py <<'PY'
          import json,time,re,hashlib,datetime,os,concurrent.futures
          from html.parser import HTMLParser
          from urllib.request import Request,urlopen
          from pathlib import Path
          def now():return datetime.datetime.now(datetime.timezone.utc).isoformat()
          class Primary(HTMLParser):
           def __init__(self):super().__init__();self.stack=[];self.prices=[];self.ids=[];self.canonical=None;self.title=[];self.tr=[];self.rows=[];self.scripts=[];self.script=[]
           def handle_starttag(self,t,a):
            d=dict(a);parent=self.stack[-1] if self.stack else {};p={'tag':t,'primary':parent.get('primary',False) or 'pricetopay' in d.get('class','').lower() or d.get('id') in ['priceToPay','priceblock_ourprice'],'off':parent.get('off',False) or 'a-offscreen' in d.get('class',''),'title':parent.get('title',False) or d.get('id')=='productTitle','json':t=='script' and d.get('type')=='application/ld+json'}
            if t=='link' and d.get('rel')=='canonical':self.canonical=d.get('href')
            if t=='input' and d.get('id')=='ASIN':self.ids.append(d.get('value'))
            if t=='tr':self.tr=[]
            if t=='script':self.script=[]
            if t not in ['input','link','meta','img','br','hr']:self.stack.append(p)
           def handle_endtag(self,t):
            if t=='tr' and self.tr:self.rows.append(' '.join(self.tr))
            if t=='script' and self.stack and self.stack[-1].get('json'):self.scripts.append(''.join(self.script))
            for i in range(len(self.stack)-1,-1,-1):
             if self.stack[i]['tag']==t:self.stack=self.stack[:i];break
           def handle_data(self,s):
            if not self.stack:return
            p=self.stack[-1]
            if p.get('primary') and p.get('off') and s.strip():self.prices.append(s.strip())
            if p.get('title'):self.title.append(s)
            if any(x['tag']=='tr' for x in self.stack) and s.strip():self.tr.append(s.strip())
            if any(x.get('json') for x in self.stack):self.script.append(s)
          def work(c):
           e={**c,'status':'UNVERIFIED','startedAt':now()};key=os.environ['TF_KEY'];t=time.monotonic()
           try:
            e['workerNotRepeated']='Five HTTP 403 responses already saved; diagnostic run isolates origin'
            t2=time.monotonic()
            with urlopen(Request(c['url'],headers={'User-Agent':'TrustFolio-Independent-Primary-Verification/1.0','Accept-Language':'en-IN,en;q=0.9'}),timeout=8) as r:raw=r.read(2500001);e['retailerHttp']=r.status;e['finalUrl']=r.url
            e['independentRTTms']=round((time.monotonic()-t2)*1000);e['independentAt']=now();e['bytes']=len(raw);e['sha256']=hashlib.sha256(raw).hexdigest();assert len(raw)<=2500000,'bounded body limit'
            p=Primary();p.feed(raw.decode(errors='replace'));e['canonical']=p.canonical;e['asinInputs']=p.ids;e['primaryTitle']=' '.join(p.title).strip();e['variantRows']=[x for x in p.rows if re.search(r'model|brand|capacity|colou?r|load|energy|star|rpm',x,re.I)][:30]
            products=[]
            def walk(x):
             if isinstance(x,list):
              for y in x:walk(y)
             elif isinstance(x,dict):
              if x.get('@type')=='Product':products.append(x)
              if '@graph' in x:walk(x['@graph'])
            for s in p.scripts:
             try:walk(json.loads(s))
             except:pass
            e['primaryProducts']=[{k:x.get(k) for k in ['name','sku','model','color','brand','offers']} for x in products]
            prices=set()
            if c['platform']=='amazon':
             for x in p.prices:
              m=re.search(r'(?:₹|Rs\.?\s*)([\d,]+(?:\.\d+)?)',x)
              if m:prices.add(float(m[1].replace(',','')))
             e['independentIdentity']=c['id'] in p.ids or bool(p.canonical and '/'+c['id'] in p.canonical)
            elif len(products)==1 and products[0].get('sku')==c['id']:
             e['independentIdentity']=True
             offers=products[0].get('offers');offers=offers if isinstance(offers,list) else [offers]
             if len(offers)==1 and offers[0] and offers[0].get('priceCurrency')=='INR':
              prices.add(float(offers[0]['price']));e['independentAvailability']=offers[0].get('availability')
            e['primaryPrices']=sorted(prices)
            s={};e['selectedWorker']=None
            title=e['primaryTitle'] or (products[0].get('name','') if len(products)==1 else '')
            cap=str(c.get('capacity','')).lower().replace(' ','');e['capacityMatch']=cap in title.lower().replace(' ','') or any(cap in x.lower().replace(' ','') for x in e['variantRows'])
            e['brandMatch']=c['brand'].lower() in title.lower();e['priceMatches']=len(prices)==1 and s.get('priceNum') in prices
            e['priceStatus']='PASS' if e.get('independentIdentity') and e['brandMatch'] and e['capacityMatch'] and e['priceMatches'] and s.get('verificationStatus')=='ok' else 'UNVERIFIED'
            # Preserve model/finish evidence for review rather than declaring variant PASS from price equality alone.
            e['status']='UNVERIFIED';e['independentPrimaryEvidenceAvailable']=bool(e.get('independentIdentity') and len(prices)==1)
           except Exception as err:
            e['error']=type(err).__name__+': '+str(err)
            if hasattr(err,'headers'):e['failureHeaders']={k:err.headers.get(k) for k in ['cf-ray','server','content-type','retry-after']};e['failureHttp']=err.code;e['failureURL']=err.url;e['safeErrorBody']=err.read(300).decode(errors='replace')
           e['finishedAt']=now();return e
          cases=json.loads(Path('accuracy-cases.json').read_text())
          with concurrent.futures.ThreadPoolExecutor(max_workers=2) as ex:results=list(ex.map(work,cases))
          report={'kind':'five genuine fresh Worker quotes paired with independent retailer HTML; no shared parser','results':results,'productionWrites':0}
          Path('independent-only-results.json').write_text(json.dumps(report,ensure_ascii=False,indent=2));print('INDEPENDENT_ONLY_RESULTS='+json.dumps(report,ensure_ascii=False))
          
          PY
          python3 independent-only.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: access-and-independent-only
          path: |
            access-diagnostic.json
            independent-only-results.json
          retention-days: 30
