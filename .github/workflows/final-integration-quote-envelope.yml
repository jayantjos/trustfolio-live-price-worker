    branches: [final-live-integration-20261103]
    paths: ['.github/workflows/final-integration-quote-envelope.yml']
permissions:
  contents: read
jobs:
  envelope:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
